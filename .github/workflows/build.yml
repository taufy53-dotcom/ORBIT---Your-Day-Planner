name: Build ORBIT

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ---------------------------------------------
      # CHECKOUT
      # ---------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # PYTHON
      # ---------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------
      # INSTALL DEPENDENCIES
      # ---------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ---------------------------------------------
      # BUILD ORBIT MAIN APPLICATION
      # ---------------------------------------------
      - name: Build Orbit
        run: |
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --windowed ^
            --name Orbit ^
            --add-data "imgs;imgs" ^
            app.py

      # ---------------------------------------------
      # BUILD ORBIT TODO APPLICATION
      # ---------------------------------------------
      - name: Build Orbit Tasks
        run: |
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --windowed ^
            --name OrbitTodo ^
            --add-data "imgs;imgs" ^
            todo.py

      # ---------------------------------------------
      # BUILD ORBIT ACCOUNT APPLICATION
      # ---------------------------------------------
      - name: Build Orbit Account
        run: |
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --windowed ^
            --name OrbitAccount ^
            --add-data "imgs;imgs" ^
            acc.py

      # ---------------------------------------------
      # CREATE INSTALLER DIRECTORY
      # ---------------------------------------------
      - name: Prepare installer files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_files

          Copy-Item "dist\Orbit\*" `
            "installer_files\" `
            -Recurse `
            -Force

          Copy-Item "dist\OrbitTodo\*" `
            "installer_files\" `
            -Recurse `
            -Force

          Copy-Item "dist\OrbitAccount\*" `
            "installer_files\" `
            -Recurse `
            -Force

      # ---------------------------------------------
      # INSTALL INNO SETUP
      # ---------------------------------------------
      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      # ---------------------------------------------
      # CREATE INSTALLER SCRIPT
      # ---------------------------------------------
      - name: Create Inno Setup script
        shell: pwsh
        run: |
          @"
          [Setup]
          AppName=ORBIT - Your Day Planner
          AppVersion=1.0.0
          DefaultDirName={autopf}\ORBIT
          DefaultGroupName=ORBIT
          OutputDir=installer
          OutputBaseFilename=ORBIT-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin

          [Files]
          Source: "installer_files\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{autodesktop}\ORBIT - Your Day Planner"; Filename: "{app}\Orbit.exe"
          Name: "{group}\ORBIT - Your Day Planner"; Filename: "{app}\Orbit.exe"

          [Run]
          Filename: "{app}\Orbit.exe"
          Description: "Launch ORBIT"
          Flags: nowait postinstall skipifsilent
          "@ | Out-File -FilePath "orbit.iss" -Encoding utf8

      # ---------------------------------------------
      # BUILD WINDOWS INSTALLER
      # ---------------------------------------------
      - name: Build installer
        run: |
          iscc orbit.iss

      # ---------------------------------------------
      # UPLOAD INSTALLER
      # ---------------------------------------------
      - name: Upload ORBIT installer
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-Windows-Installer
          path: installer/ORBIT-Setup.exe
